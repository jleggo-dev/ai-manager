# Live coach-behaviour probes (REQ10 §11 — "the probe is manual, not CI" gap, closed).
#
# Two probes against the DEPLOYED AI Admin, asking questions at two different levels:
#   • probe-coach-tools.ts — does the coach pick the right tool INSIDE one activity, and configure
#     it for the right practice? Eight prescribe-session scenarios in user voice (wants, bans and
#     traps, plus a novelist and a student whose journal prompts must match their craft/study
#     family), five Broker transcripts (including injection, negation, and mid-message
#     correction), a now-menu register check.
#   • probe-plan-shape.ts — does a day get the right NUMBER of activities (REQ10 §12)? Mind-only
#     must not collapse to one node, strength must not shatter into per-exercise nodes, and someone
#     who asked for one thing a day must not be padded to hit a number.
# Both run through the same normalizers the app uses.
#
# Deliberately its OWN workflow, not a CI job: the coach is stochastic, so this must never gate a
# merge. A red run here means "look at the output", not "revert". Two suite repetitions per run
# (--runs 2) so a flaky scenario shows up as flaky instead of passing on luck.
#
# Spends real model calls (~30 jobs per run) — hence weekly + on-demand, not per-push.
#
# Local equivalent:
#   node --import tsx apps/cadence-api/scripts/probe-coach-tools.ts --runs 2
#   node --import tsx apps/cadence-api/scripts/probe-plan-shape.ts --runs 2
#
name: Coach behaviour probe

on:
  schedule:
    # Weekly, Monday 13:00 UTC — after a weekend of prompt/catalog changes has settled.
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AI_ADMIN_API_KEY: ${{ secrets.AI_ADMIN_API_KEY }}
      AI_ADMIN_BASE_URL: ${{ secrets.AI_ADMIN_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install (workspaces)
        run: npm ci
      - name: Probe tool choice (2 full passes)
        run: node --import tsx apps/cadence-api/scripts/probe-coach-tools.ts --runs 2
      # `if: always()` so a red tool probe still lets the plan-shape result be seen — the two fail
      # for unrelated reasons, and hiding one behind the other wastes a whole week.
      - name: Probe plan shape (2 full passes)
        if: always()
        run: node --import tsx apps/cadence-api/scripts/probe-plan-shape.ts --runs 2
