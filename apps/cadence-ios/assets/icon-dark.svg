<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon, DARK appearance. Same Metronome Split geometry as icon.svg (see it for the source
       of truth and the "don't redraw by eye" note). Two things change, both required by
       cadence-brand-identity-v2.md §9:

       1. Plate is charcoal #1C1A17 (Default sits on pure white).
       2. Fills use the palette's DARK-mode values (sun #F0997B, dusk #9DBBD4), not the light ones.
          Not a nicety: at icon sizes the light dusk #3E5C76 on charcoal is near-invisible, so the
          night wedge — and with it the whole day/night reading — disappears on exactly the home
          screen this variant exists for. -->
  <rect width="1024" height="1024" fill="#1C1A17"/>
  <g transform="translate(112 112) scale(8)">
    <defs>
      <clipPath id="day"><polygon points="-50,-50 166.6,-50 -50,166.6"/></clipPath>
      <clipPath id="night"><polygon points="173.4,-50 173.4,173.4 -50,173.4"/></clipPath>
    </defs>
    <path d="M 79.737 66.484 A 34 34 0 1 1 79.737 33.516 L 66.773 39.107 A 20 20 0 1 0 66.773 60.893 Z" fill="#F0997B" clip-path="url(#day)"/>
    <path d="M 79.737 66.484 A 34 34 0 1 1 79.737 33.516 L 66.773 39.107 A 20 20 0 1 0 66.773 60.893 Z" fill="#9DBBD4" clip-path="url(#night)"/>
  </g>
</svg>
