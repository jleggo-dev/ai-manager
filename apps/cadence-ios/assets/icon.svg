<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon, DEFAULT appearance: the Cadence mark, Metronome Split (BRAND.md, locked
       2026-08-07 — supersedes the sunrise arch).

       Geometry transcribed from docs/cadence/assets/cadence-icon-metronome-split.svg, the export
       from cadence-icon-contact-sheet.html. Identical to components/Orb.tsx: C centred (50,50),
       outer r=34, counter r=20 (thickness 14), 58° aperture; cut on a 45° line through (60,60),
       offset from the letter's own centre so it leaves through the aperture and crosses ink once.
       Do not redraw by eye — re-export from the contact sheet instead.

       Plate is pure white, NOT the product cream: the identity doc is explicit that cream is an
       in-app / brand-ground colour and the Default icon plate is white. Kept SQUARE — the export
       carries rx="228" for standalone display, but iOS applies its own mask and a baked corner
       radius would punch transparent corners through it.

       Flat solid fills only: required by the Icon Composer pipeline (one layered source →
       Default / Dark / Mono) and correct under Liquid Glass, where the system renders depth. -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <g transform="translate(112 112) scale(8)">
    <defs>
      <clipPath id="day"><polygon points="-50,-50 166.6,-50 -50,166.6"/></clipPath>
      <clipPath id="night"><polygon points="173.4,-50 173.4,173.4 -50,173.4"/></clipPath>
    </defs>
    <path d="M 79.737 66.484 A 34 34 0 1 1 79.737 33.516 L 66.773 39.107 A 20 20 0 1 0 66.773 60.893 Z" fill="#D85A30" clip-path="url(#day)"/>
    <path d="M 79.737 66.484 A 34 34 0 1 1 79.737 33.516 L 66.773 39.107 A 20 20 0 1 0 66.773 60.893 Z" fill="#3E5C76" clip-path="url(#night)"/>
  </g>
</svg>
