       Cream (not the icon's white plate) is correct here: cadence-brand-identity-v2.md §9 scopes
       #F4EFE4 as the in-app / brand ground, and the splash is the first in-app surface.

       Geometry transcribed from docs/cadence/assets/cadence-mark-metronome-split.svg — identical
       to components/Orb.tsx and assets/icon.svg. Do not redraw by eye; re-export from
