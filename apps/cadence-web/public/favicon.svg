<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cadence">
  <!-- Browser tab / bookmark mark: Metronome Split, geometry transcribed from
       docs/cadence/assets/cadence-mark-metronome-split.svg — identical to components/Orb.tsx and
       apps/cadence-ios/assets/icon.svg. Do not redraw by eye; re-export from the contact sheet.

       Transparent ground on purpose: a favicon sits on whatever chrome the browser paints, and
       terracotta + dusk both hold against light and dark tab bars. The PLATED variants (white for
       Default, charcoal for Dark) are the installed-app icons in manifest.webmanifest, where a
       ground is required. -->
  <defs>
    <clipPath id="day"><polygon points="-50,-50 166.6,-50 -50,166.6"/></clipPath>
    <clipPath id="night"><polygon points="173.4,-50 173.4,173.4 -50,173.4"/></clipPath>
  </defs>
  <path d="M 79.737 66.484 A 34 34 0 1 1 79.737 33.516 L 66.773 39.107 A 20 20 0 1 0 66.773 60.893 Z" fill="#D85A30" clip-path="url(#day)"/>
  <path d="M 79.737 66.484 A 34 34 0 1 1 79.737 33.516 L 66.773 39.107 A 20 20 0 1 0 66.773 60.893 Z" fill="#3E5C76" clip-path="url(#night)"/>
</svg>
