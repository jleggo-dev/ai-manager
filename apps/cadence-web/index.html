<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable are deliberate: this ships as a native app, not a web page.
      A WKWebView honours pinch-zoom and KEEPS it, so one stray two-finger touch (easy to do while
      scrolling a chat) leaves every screen zoomed and panning side to side, for the rest of the
      session and across navigations. There is no browser chrome to reset it and no gesture a user
      would think to look for. The accessibility answer here is the OS one — Dynamic Type and
      Display Zoom, which apply to the whole device — not a webview scale the app cannot see. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Cadence</title>
    <meta
      name="description"
      content="A coach you just talk to — it listens, remembers you, and turns what you say into a rhythm you can keep."
    />

    <!-- Brand surfaces the app itself can't paint. Until now cadence-web shipped NO favicon,
         manifest or touch icon at all, so a PWA-first product installed to the home screen with a
         blank icon and no name — the one brand surface a user sees before the app even loads. -->

    <!-- SVG favicon is the mark on a transparent ground (it sits on browser chrome, and terracotta
         + dusk hold against both light and dark tab bars). PNG fallback for browsers without SVG
         favicon support. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- iOS "Add to Home Screen". Must be opaque: iOS composites a transparent icon on black,
         which would lose the dusk half entirely. White plate = the brand's Default icon ground. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Cadence" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Tints the browser/OS chrome around the app. Cream is the in-app ground; charcoal is its
         dark counterpart (identity doc §9). Not the icon plate colours — those are white/charcoal
         and only apply to the icon itself. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4EFE4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1C1A17" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
