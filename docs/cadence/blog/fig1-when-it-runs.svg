<svg viewBox="0 0 620 610" width="1240" height="1220" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="620" height="610" fill="#FFFFFF"/>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8C867D"/></marker>
</defs>

<rect x="200" y="18" width="220" height="42" rx="8" fill="#FBFAF8" stroke="#CBC6BB"/>
<text x="310" y="44" text-anchor="middle" font-size="13" fill="#201F1D">User sends first message</text>
<line x1="310" y1="60" x2="310" y2="84" stroke="#8C867D" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="70" y="88" width="480" height="198" rx="12" fill="#F0EEE8" stroke="#E4E0D8"/>
<text x="92" y="110" font-size="12" font-weight="700" fill="#B4530B">SESSION OPEN · runs once per conversation</text>
<rect x="95" y="120" width="430" height="44" rx="8" fill="#FBFAF8" stroke="#CBC6BB"/>
<text x="112" y="140" font-size="13" font-weight="600" fill="#201F1D">1. buildContextPack()</text>
<text x="112" y="156" font-size="11" fill="#5A554E">pull + curate the context — the picking engine</text>
<rect x="95" y="172" width="430" height="44" rx="8" fill="#FBFAF8" stroke="#CBC6BB"/>
<text x="112" y="192" font-size="13" font-weight="600" fill="#201F1D">2. openCoachSession()</text>
<text x="112" y="208" font-size="11" fill="#5A554E">persona = system prompt (from the coach job)</text>
<rect x="95" y="224" width="430" height="44" rx="8" fill="#FBFAF8" stroke="#CBC6BB"/>
<text x="112" y="244" font-size="13" font-weight="600" fill="#201F1D">3. injectCoachContext()</text>
<text x="112" y="260" font-size="11" fill="#5A554E">pack added as a separate context turn</text>

<line x1="310" y1="286" x2="310" y2="308" stroke="#8C867D" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="200" y="310" width="220" height="42" rx="8" fill="#FBFAF8" stroke="#CBC6BB"/>
<text x="310" y="336" text-anchor="middle" font-size="13" fill="#201F1D">Coach replies (grounded)</text>
<line x1="310" y1="352" x2="310" y2="374" stroke="#8C867D" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="40" y="378" width="540" height="150" rx="12" fill="#F0EEE8" stroke="#E4E0D8"/>
<text x="62" y="400" font-size="12" font-weight="700" fill="#B4530B">EVERY TURN · loops</text>
<rect x="60" y="410" width="160" height="52" rx="8" fill="#FBFAF8" stroke="#CBC6BB"/>
<text x="140" y="432" text-anchor="middle" font-size="12" font-weight="600" fill="#201F1D">sendCoachMessage</text>
<text x="140" y="449" text-anchor="middle" font-size="10.5" fill="#5A554E">Coach LLM · stream</text>
<rect x="230" y="410" width="160" height="52" rx="8" fill="#FBFAF8" stroke="#CBC6BB"/>
<text x="310" y="432" text-anchor="middle" font-size="12" font-weight="600" fill="#201F1D">recordCoachReply</text>
<text x="310" y="449" text-anchor="middle" font-size="10.5" fill="#5A554E">log turn + tokens</text>
<rect x="400" y="410" width="160" height="52" rx="8" fill="#FBFAF8" stroke="#CBC6BB"/>
<text x="480" y="432" text-anchor="middle" font-size="12" font-weight="600" fill="#201F1D">capture_extract</text>
<text x="480" y="449" text-anchor="middle" font-size="10.5" fill="#5A554E">Broker to DB · async</text>
<line x1="220" y1="436" x2="230" y2="436" stroke="#8C867D" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="390" y1="436" x2="400" y2="436" stroke="#8C867D" stroke-width="1.5" marker-end="url(#a)"/>
<text x="310" y="502" text-anchor="middle" font-size="11" fill="#8C867D">repeats each message — the pack is NOT rebuilt (reused as history)</text>

<line x1="310" y1="528" x2="310" y2="550" stroke="#8C867D" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="210" y="552" width="200" height="40" rx="8" fill="#FBFAF8" stroke="#CBC6BB"/>
<text x="310" y="577" text-anchor="middle" font-size="13" font-weight="600" fill="#201F1D">to Review to Lock</text>
</svg>
